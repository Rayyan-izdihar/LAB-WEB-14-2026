<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Logo Kopi Senja</title>
  <desc id="d">Matahari terbenam bergaris di atas horizon cokelat dengan sebutir biji kopi.</desc>
  <defs>
    <clipPath id="badge"><circle cx="32" cy="32" r="30"/></clipPath>
    <clipPath id="langit"><rect x="0" y="0" width="64" height="42"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <!-- Latar: warna tan -->
    <rect width="64" height="64" fill="#D9A878"/>

    <!-- Matahari senja (krem) dengan garis-garis -->
    <g clip-path="url(#langit)">
      <circle cx="32" cy="30" r="15" fill="#FBEBD3"/>
      <rect x="14" y="33" width="36" height="2" fill="#D9A878"/>
      <rect x="14" y="37.5" width="36" height="2.6" fill="#D9A878"/>
    </g>

    <!-- Horizon cokelat kopi -->
    <rect x="0" y="42" width="64" height="22" fill="#7B5446"/>

    <!-- Biji kopi -->
    <g transform="rotate(-25 32 53)">
      <ellipse cx="32" cy="53" rx="9" ry="6" fill="#D9A878"/>
      <path d="M23.5 53.5 C27.5 50, 36.5 56, 40.5 52.5" fill="none" stroke="#7B5446" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cincin krem agar jelas di latar cokelat -->
  <circle cx="32" cy="32" r="29.2" fill="none" stroke="#FBEBD3" stroke-width="1.6"/>
</svg>
